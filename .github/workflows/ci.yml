name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv & install project + [dev, mcp] extras
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev,mcp]"

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest
